[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-vision-mcp"
version = "0.1.0"
description = "视觉 MCP Server：通过智谱 GLM-4.6V-Flash 把图片转为结构化文字与 OCR 结果，为文本模型补充视觉理解能力"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "glm", "vision", "ocr", "zhipu", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
glm-vision = "vision_server:main"

[tool.setuptools]
py-modules = ["vision_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]